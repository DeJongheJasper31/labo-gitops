# Poort 80: de gewone website.
server {
  listen 80;
  location / {
    root  /usr/share/nginx/html;
    index index.html;
  }
}

# Poort 8080: interne teller (stub_status) die alleen de exporter in dezelfde pod mag lezen.
server {
  listen 8080;
  location /stub_status {
    stub_status;
    allow 127.0.0.1;
    deny all;
  }
}
