# "App of apps": deze ene Application wijst naar de map apps/ in deze repo.
# Elke Application-manifest die daar staat, wordt door Argo CD automatisch aangemaakt.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: REPLACE_ME
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
