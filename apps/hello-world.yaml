# Argo CD Application voor de hello-world-pagina.
# Omdat dit bestand in apps/ staat, maakt de root-app het automatisch aan.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DeJongheJasper31/labo-gitops.git
    targetRevision: main
    path: hello-world          # Argo CD ziet kustomization.yaml en gebruikt Kustomize
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-world
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
